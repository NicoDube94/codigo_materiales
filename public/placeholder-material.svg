<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#0f1117"/>
  
  <!-- Subtle grid lines -->
  <line x1="0" y1="50" x2="300" y2="50" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="0" y1="100" x2="300" y2="100" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="0" y1="150" x2="300" y2="150" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="75" y1="0" x2="75" y2="200" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#1a1f2e" stroke-width="1"/>
  <line x1="225" y1="0" x2="225" y2="200" stroke="#1a1f2e" stroke-width="1"/>

  <!-- Outer box -->
  <rect x="105" y="62" width="90" height="78" rx="6" fill="none" stroke="#2a3048" stroke-width="2"/>

  <!-- Box bottom flap -->
  <rect x="105" y="100" width="90" height="40" rx="0 0 6 6" fill="#1a2035" stroke="#2a3048" stroke-width="2"/>

  <!-- Box top flaps -->
  <path d="M105 80 L105 62 L150 70 L195 62 L195 80" fill="#1a2035" stroke="#2a3048" stroke-width="2"/>

  <!-- Center divider line on top flaps -->
  <line x1="150" y1="62" x2="150" y2="80" stroke="#2a3048" stroke-width="2"/>

  <!-- Tape strip across box -->
  <rect x="138" y="62" width="24" height="78" fill="#1e2840" opacity="0.6"/>

  <!-- Camera icon in center -->
  <rect x="129" y="90" width="42" height="30" rx="4" fill="none" stroke="#44d8d8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="105" r="8" fill="none" stroke="#44d8d8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="105" r="4" fill="#44d8d8" opacity="0.3"/>
  <rect x="158" y="93" width="6" height="4" rx="1" fill="#44d8d8" opacity="0.5"/>

  <!-- Text labels -->
  <text x="150" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#44d8d8" opacity="0.5" letter-spacing="2">SIN FOTO</text>
  <text x="150" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#2a3048" letter-spacing="1">MATERILOG</text>

  <!-- Corner accents -->
  <line x1="15" y1="15" x2="30" y2="15" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="15" y1="15" x2="15" y2="30" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="285" y1="15" x2="270" y2="15" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="285" y1="15" x2="285" y2="30" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="15" y1="185" x2="30" y2="185" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="15" y1="185" x2="15" y2="170" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="285" y1="185" x2="270" y2="185" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
  <line x1="285" y1="185" x2="285" y2="170" stroke="#44d8d8" stroke-width="1" opacity="0.3"/>
</svg>
